<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alain — Szene 1: Die Herausforderung</title>
    <link rel="stylesheet" href="/src/film/film.css" />
  </head>
  <body>
    <main class="film">
      <div id="stage" class="film__stage"></div>
      <div id="callouts" class="film__callouts" aria-hidden="true"></div>

      <section id="title-card" class="film__card">
        <p class="film__kicker">Szene 1</p>
        <h1 class="film__title">Die Herausforderung</h1>
        <button id="play" class="film__button" type="button">▶ Abspielen (mit Ton)</button>
      </section>

      <section id="end-card" class="film__card film__card--end" hidden>
        <h2 class="film__title">Fortsetzung folgt …</h2>
        <button id="replay" class="film__button" type="button">↺ Nochmal</button>
      </section>

      <p id="error" class="film__error" role="alert" hidden></p>
    </main>
    <script type="module" src="/src/film/main.ts"></script>
  </body>
</html>
