<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alain alain Zuhaus</title>
    <link rel="stylesheet" href="/src/film/film.css" />
  </head>
  <body>
    <main class="film">
      <div id="stage" class="film__stage"></div>
      <div id="callouts" class="film__callouts" aria-hidden="true"></div>
      <section id="choice" class="film__choice" aria-live="polite" hidden></section>

      <section id="title-card" class="film__card film__card--title">
        <div class="film__sign">
          <h1 class="film__title">Alain alain Zuhaus</h1>
        </div>
        <button id="play" class="film__button" type="button">▶ Start</button>
      </section>

      <section id="end-card" class="film__card film__card--end" hidden>
        <h2 id="end-title" class="film__title">Fortsetzung folgt …</h2>
        <button id="replay" class="film__button" type="button">↺ Nochmal</button>
      </section>

      <form id="debug" class="film__debug" hidden>
        <span id="debug-time" class="film__debug-time">0.0 s</span>
        <label class="film__debug-slider">
          Springe zu
          <input id="debug-seek" type="range" min="0" max="300" step="0.1" value="0" />
          <output id="debug-seek-value" for="debug-seek">0 s</output>
        </label>
        <span>Leertaste = Pause</span>
      </form>

      <p id="error" class="film__error" role="alert" hidden></p>
    </main>
    <script type="module" src="/src/film/main.ts"></script>
  </body>
</html>
